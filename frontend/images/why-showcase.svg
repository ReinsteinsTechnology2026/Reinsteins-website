<svg viewBox="0 0 500 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#B19463" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B19463" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#B19463" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="500" height="520" fill="url(#bgGrad)"/>
  <rect width="500" height="520" fill="url(#dots)"/>
  <rect width="500" height="520" fill="url(#glow)"/>

  <!-- orbit rings -->
  <circle cx="250" cy="225" r="150" fill="none" stroke="#B19463" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="250" cy="225" r="108" fill="none" stroke="#B19463" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- connector lines from center to satellites -->
  <g stroke="#B19463" stroke-width="1.4" stroke-opacity="0.55">
    <line x1="250" y1="225" x2="140" y2="112"/>
    <line x1="250" y1="225" x2="360" y2="112"/>
    <line x1="250" y1="225" x2="140" y2="345"/>
    <line x1="250" y1="225" x2="360" y2="345"/>
  </g>
  <g fill="#B19463">
    <circle cx="195" cy="168" r="2.6"/>
    <circle cx="305" cy="168" r="2.6"/>
    <circle cx="195" cy="285" r="2.6"/>
    <circle cx="305" cy="285" r="2.6"/>
  </g>

  <!-- center core: hex with R monogram -->
  <g transform="translate(250,225)">
    <polygon points="0,-56 48,-28 48,28 0,56 -48,28 -48,-28" fill="#171717" stroke="#B19463" stroke-width="2"/>
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#B19463" stroke-opacity="0.35" stroke-width="1"/>
    <text x="0" y="16" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="42" fill="#B19463" font-weight="600">R</text>
  </g>

  <!-- satellite: Cloud (top-left) -->
  <g transform="translate(140,112)">
    <circle r="44" fill="#232323" stroke="#B19463" stroke-width="1.6"/>
    <path d="M-19,10 a12,12 0 0 1 1,-23.8 a15,15 0 0 1 29,-3 a11,11 0 0 1 3,21.8 z" fill="none" stroke="#EDE6D8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- satellite: AI chip (top-right) -->
  <g transform="translate(360,112)">
    <circle r="44" fill="#232323" stroke="#B19463" stroke-width="1.6"/>
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="#EDE6D8" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#EDE6D8" stroke-width="2"/>
    <g stroke="#EDE6D8" stroke-width="2">
      <line x1="-16" y1="-8" x2="-24" y2="-8"/>
      <line x1="-16" y1="8" x2="-24" y2="8"/>
      <line x1="16" y1="-8" x2="24" y2="-8"/>
      <line x1="16" y1="8" x2="24" y2="8"/>
      <line x1="-8" y1="-16" x2="-8" y2="-24"/>
      <line x1="8" y1="-16" x2="8" y2="-24"/>
      <line x1="-8" y1="16" x2="-8" y2="24"/>
      <line x1="8" y1="16" x2="8" y2="24"/>
    </g>
  </g>

  <!-- satellite: Shield (bottom-left) -->
  <g transform="translate(140,345)">
    <circle r="44" fill="#232323" stroke="#B19463" stroke-width="1.6"/>
    <path d="M0,-19 L16,-12 V4 C16,15 9,22 0,26 C-9,22 -16,15 -16,4 V-12 Z" fill="none" stroke="#EDE6D8" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-7,2 L-2,9 L9,-6" fill="none" stroke="#EDE6D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- satellite: Growth chart (bottom-right) -->
  <g transform="translate(360,345)">
    <circle r="44" fill="#232323" stroke="#B19463" stroke-width="1.6"/>
    <g fill="#EDE6D8">
      <rect x="-19" y="4" width="8" height="15"/>
      <rect x="-6" y="-4" width="8" height="23"/>
      <rect x="7" y="-14" width="8" height="33"/>
    </g>
    <path d="M-19,-6 L-2,-16 L15,-24" fill="none" stroke="#B19463" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8,-24 L15,-24 L15,-17" fill="none" stroke="#B19463" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom label -->
  <g transform="translate(0,466)">
    <rect x="30" y="0" width="440" height="54" rx="10" fill="#0d0d0d" fill-opacity="0.75" stroke="#B19463" stroke-opacity="0.3"/>
    <rect x="30" y="0" width="4" height="54" fill="#B19463"/>
    <text x="52" y="23" font-family="Manrope, sans-serif" font-size="13.5" letter-spacing="0.5" fill="#EDE6D8" font-weight="700">ONE CONNECTED TECHNOLOGY ECOSYSTEM</text>
    <text x="52" y="41" font-family="Manrope, sans-serif" font-size="12.5" fill="#9a9a9a">AI · Cloud · Security · Data — engineered to grow with you</text>
  </g>
</svg>
